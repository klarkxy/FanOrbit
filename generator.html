<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>FanOrbit 生成器</title>
  <style>
    body {
      font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      max-width: 860px;
      margin: 0 auto;
      padding: 32px 24px;
      color: #1e2033;
      background: #faf9ff;
    }
    h1 { color: #6d28d9; font-size: 20px; }
    #meta { color: #6b6f8d; margin: 8px 0; }
    #preview { display: none; max-width: 100%; border-radius: 12px; box-shadow: 0 8px 30px rgba(124,58,237,.18); }
    button {
      margin-right: 8px; padding: 8px 18px; border: none; border-radius: 8px;
      background: #7c3aed; color: #fff; font: inherit; font-weight: 600; cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: default; }
    .progressWrap { height: 8px; width: 420px; max-width: 100%; border-radius: 4px;
      background: #e5e1f5; overflow: hidden; margin: 12px 0; }
    .progressFill { height: 100%; width: 0; background: #7c3aed; transition: width .3s; }
    #genControls { margin: 12px 0; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
    #genControls label { display: inline-flex; gap: 6px; align-items: center; color: #41456b; }
    #genControls select { font: inherit; padding: 4px 8px; border: 1px solid #cfc9ee; border-radius: 6px;
      background: #fff; color: inherit; }
    #genControls input[type="checkbox"] { width: auto; }
  </style>
</head>
<body>
  <h1>FanOrbit — 头像墙、同心环与角色马赛克</h1>
  <div class="progressWrap"><div class="progressFill" id="fill"></div></div>
  <div id="status">正在读取数据…</div>
  <div id="meta"></div>
  <div id="genControls">
    <label>成图
      <select id="shapeSel">
        <option value="circle">圆形（同心环）</option>
        <option value="square">方形（方环）</option>
        <option value="grid">普通头像墙</option>
        <option value="mosaic">角色马赛克</option>
      </select>
    </label>
    <label>中心倍数
      <select id="selfScaleSel">
        <option value="2">2 倍</option>
        <option value="3">3 倍</option>
        <option value="4">4 倍</option>
      </select>
    </label>
    <label>分图条数
      <input id="splitPartsSel" type="number" min="1" step="1" value="1" />
    </label>
    <label>马赛克目标图
      <input id="targetFile" type="file" accept="image/*" />
    </label>
  </div>
  <pre id="report" style="white-space:pre-wrap;color:#41456b;"></pre>
  <div style="margin: 16px 0;">
    <img id="preview" alt="FanOrbit 头像墙预览" />
  </div>
  <button id="saveBtn">保存 JPG</button>
  <button id="pngBtn">保存高清 PNG</button>
  <button id="zipBtn">保存切片 ZIP</button>
  <button id="againBtn">重新生成</button>

  <script src="lib/avatar-url.js"></script>
  <script src="lib/coverage.js"></script>
  <script src="lib/mosaic.js"></script>
  <script src="lib/slice.js"></script>
  <script src="lib/zipstore.js"></script>
  <script src="lib/layout.js"></script>
  <script src="db.js"></script>
  <script src="downloader.js"></script>
  <script src="generator.js"></script>
</body>
</html>
