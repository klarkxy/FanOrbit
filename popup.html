<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>FanOrbit 控制面板</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>FanOrbit</header>
  <p class="hint">插件只使用已登录粉丝页和公开网页源，没有 Grok Bot 的 X 连接。也可以导入一份公开数据文件。</p>

  <label>
    <span>X 用户名</span>
    <input id="username" type="text" placeholder="输入你的 X 用户名" spellcheck="false" />
  </label>

  <label>
    <span>数量上限（留空 = 全部）</span>
    <input id="maxCount" type="number" min="1" placeholder="全部" />
  </label>

  <label>
    <span>头像大小（px）</span>
    <input id="avatarSize" type="number" min="40" max="300" value="96" />
  </label>

  <label class="row">
    <span>背景颜色</span>
    <input id="bgColor" type="color" value="#f5f3ff" />
  </label>

  <label>
    <span>互动扫描深度</span>
    <select id="scanMode">
      <option value="fast">快速（约几十秒）</option>
      <option value="deep">深入（更慢，覆盖更久）</option>
    </select>
  </label>

  <label>
    <span>中心头像倍数（粉丝头像统一大小）</span>
    <select id="selfScale">
      <option value="2">2 倍</option>
      <option value="3">3 倍</option>
      <option value="4">4 倍</option>
    </select>
  </label>

  <label class="row">
    <span>颜色排序（彩虹环）</span>
    <input id="colorSort" type="checkbox" style="width:auto" />
  </label>

  <label>
    <span>成图</span>
    <select id="output">
      <option value="circle">圆形同心环</option>
      <option value="square">方形环</option>
      <option value="grid">普通头像墙（每人一次）</option>
      <option value="mosaic">角色头像马赛克</option>
    </select>
  </label>

  <label>
    <span>分图条数（1 = 不分。按空隙能切多少算多少，不是平台张数上限）</span>
    <input id="splitParts" type="number" min="1" step="1" value="1" />
  </label>

  <label>
    <span>点名必选（每行一个用户名，可不是粉丝）</span>
    <textarea id="mustNames" rows="3" placeholder="留空则只保护本次双向互动的人"></textarea>
  </label>

  <label>
    <span>导入公开数据 JSON</span>
    <input id="importFile" type="file" accept="application/json,.json" />
  </label>

  <button id="startBtn">从粉丝页开始采集</button>
  <button id="genBtn" class="secondary">用已有数据打开生成页</button>

  <div class="progressWrap">
    <div class="progressFill" id="fill"></div>
  </div>
  <div id="status">待开始</div>
  <div id="meta" class="meta"></div>

  <script src="lib/avatar-url.js"></script>
  <script src="lib/import-public.js"></script>
  <script src="lib/layout.js"></script>
  <script type="module" src="popup.js"></script>
</body>
</html>
