<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>FanOrbit 控制面板</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>FanOrbit</header>
  <p class="hint">把你放在中心，粉丝按互动频率由内向外环绕。</p>

  <label>
    <span>X 用户名</span>
    <input id="username" type="text" placeholder="输入你的 X 用户名" spellcheck="false" />
  </label>

  <label>
    <span>数量上限（留空 = 全部）</span>
    <input id="maxCount" type="number" min="1" placeholder="全部" />
  </label>

  <label>
    <span>头像大小（px）</span>
    <input id="avatarSize" type="number" min="40" max="300" value="96" />
  </label>

  <label class="row">
    <span>背景颜色</span>
    <input id="bgColor" type="color" value="#f5f3ff" />
  </label>

  <label>
    <span>互动扫描深度</span>
    <select id="scanMode">
      <option value="fast">快速（约几十秒）</option>
      <option value="deep">深入（更慢，覆盖更久）</option>
    </select>
  </label>

  <label>
    <span>中心头像倍数（粉丝头像统一大小）</span>
    <select id="selfScale">
      <option value="2">2 倍</option>
      <option value="3">3 倍</option>
      <option value="4">4 倍</option>
    </select>
  </label>

  <label class="row">
    <span>颜色排序（彩虹环）</span>
    <input id="colorSort" type="checkbox" style="width:auto" />
  </label>

  <label>
    <span>布局形状</span>
    <select id="shape">
      <option value="circle">圆形（同心环）</option>
      <option value="square">方形（方环）</option>
    </select>
  </label>

  <label>
    <span>分图条数（竖切，奇数，中心头像在正中间一条）</span>
    <select id="splitParts">
      <option value="1">不分图</option>
      <option value="3">3 条</option>
      <option value="5">5 条</option>
      <option value="7">7 条</option>
      <option value="9">9 条</option>
      <option value="11">11 条</option>
      <option value="13">13 条</option>
      <option value="15">15 条</option>
      <option value="17">17 条</option>
      <option value="19">19 条</option>
    </select>
  </label>

  <button id="startBtn">开始制作</button>
  <button id="genBtn" class="secondary">打开生成页面</button>

  <div class="progressWrap">
    <div class="progressFill" id="fill"></div>
  </div>
  <div id="status">待开始</div>
  <div id="meta" class="meta"></div>

  <script src="lib/layout.js"></script>
  <script src="popup.js"></script>
</body>
</html>
